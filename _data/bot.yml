answers:
  en:
    greet: Hi! 👋 I answer common questions about the Maharashtra Board SSC and HSC exams 2027. Tap a topic or type your question.
    dates: '<b>SSC (Class 10)</b> written papers: 15 Feb to 11 Mar 2027.<br><b>HSC (Class 12)</b> written papers: 8 Feb to 16 Mar 2027.<br>As announced by the board on 17 Sep 2026. <a href=''{cd}''>See the live countdown</a>.'
    practical: '<b>HSC</b> practicals, orals and internal assessment: 20 Jan to 6 Feb 2027.<br><b>SSC</b>: 28 Jan to 13 Feb 2027.<br>This week, check that every journal is complete and signed. Your school gives the exact practical date.'
    timetable: The subject-wise timetable has not been released yet. As soon as the board publishes it, it goes on the <a href='{hd}'>Help Desk</a>. Subscribe there to get it by email.
    sample: 'The board''s own sample question papers are free: on <a href=''https://mahahsscboard.in'' target=''_blank'' rel=''noopener''>mahahsscboard.in</a> open Student Login, then Sample Question Paper, then pick HSC or SSC and the subject.'
    books: 'All Maharashtra Board textbooks are free as PDFs on Balbharati: <a href=''https://books.ebalbharati.in/'' target=''_blank'' rel=''noopener''>books.ebalbharati.in</a>'
    solutions: 'Free chapter-wise answers for Maharashtra Board textbooks are on Shaalaa.com. The links by class are on the <a href=''{hd}''>Help Desk</a>. Tip: try the question first, then check.'
    hallticket: Hall tickets come from the board through your school, shortly before the exams. The date isn't announced yet; it will be on the <a href='{hd}'>Help Desk</a>. When you get it, check the name, photo, seat number, subjects and exam centre, and report any mistake to the school the same day.
    study: '{phase}<br>For the full week-by-week plan, see the <a href=''{kit}'' target=''_blank'' rel=''noopener''>Countdown Kit</a>.'
    kit: The <b>Board Exam Countdown Kit 2027</b> is a 7-page plan for parents, from today to the last paper, in English, Marathi and Urdu. {price}<a href='{kit}' target='_blank' rel='noopener'>Get it here</a>. If money is tight, message Basheer Sir and he'll send it free.
    stress: Exam fear usually comes from not knowing what's left. Write down what's done and what's left, week by week. Keep 7 to 8 hours of sleep, a short break every 45 minutes, and talk about progress, not marks. If worry affects sleep or eating for weeks, speak to the school counsellor or a doctor.
    result: Board results usually come out in May or June. The board announces the exact date on its official website, and it will be on the <a href='{hd}'>Help Desk</a> too.
    career: Graduated but the job search is stuck? The <a href='{cc}'>Career Clarity Session</a> is 60 minutes with Basheer Sir, and you leave with a written 30-day plan. ₹1,499.
    stream: 'Choosing a stream after 10th is a big decision. Start with three questions: which subjects does your child enjoy, which do they score in, and which careers excite them? The Kit has a stream worksheet, and you can talk it through with Basheer Sir on WhatsApp.'
    contact: 'Basheer Sir answers personally on WhatsApp:'
    fallback: 'I don''t know that one yet. Ask Basheer Sir directly on WhatsApp:'
    price: 'Special price ₹249 till the board exams. '
    phases:
    - 'Right now: <b>finish the syllabus by 30 Nov</b>, including the chapters your child avoids. Mark each chapter 1 to 5; anything 3 or below goes on a weak list, one weak chapter a day.'
    - 'Right now: <b>revision round 1</b>. One subject block a day, then 20 minutes of recall from memory with the book closed. Sunday evening, 10 minutes together: what got done, what''s next.'
    - 'Right now: <b>practice papers</b>. One full paper at home each week in the real time limit, then check it against the board''s sample papers.'
    - 'Right now: <b>practicals and revision round 2</b>. Journals complete and signed, then short daily revision of formulas, diagrams and definitions.'
    - 'Right now: <b>exam mode</b>. 7 to 8 hours of sleep, no new topics, revise only from your own notes, and check the hall ticket and centre the day before.'
  mr:
    greet: नमस्कार! 👋 महाराष्ट्र बोर्ड SSC आणि HSC परीक्षा 2027 बद्दलच्या नेहमीच्या प्रश्नांची उत्तरे मी देतो. विषय निवडा किंवा तुमचा प्रश्न लिहा.
    dates: '<b>SSC (इयत्ता 10 वी)</b> लेखी परीक्षा: 15 फेब्रुवारी ते 11 मार्च 2027.<br><b>HSC (इयत्ता 12 वी)</b> लेखी परीक्षा: 8 फेब्रुवारी ते 16 मार्च 2027.<br>मंडळाने 17 सप्टेंबर 2026 रोजी जाहीर केल्याप्रमाणे. <a href=''{cd}''>लाइव्ह काउंटडाउन पाहा</a>.'
    practical: '<b>HSC</b> प्रात्यक्षिक, तोंडी आणि अंतर्गत मूल्यमापन: 20 जानेवारी ते 6 फेब्रुवारी 2027.<br><b>SSC</b>: 28 जानेवारी ते 13 फेब्रुवारी 2027.<br>या आठवड्यात सर्व जर्नल पूर्ण आणि सही केलेले आहेत का ते तपासा. प्रात्यक्षिकाची नेमकी तारीख शाळा देईल.'
    timetable: विषयनिहाय वेळापत्रक अजून जाहीर झालेले नाही. मंडळाने जाहीर करताच ते <a href='{hd}'>हेल्प डेस्क</a>वर दिले जाईल.
    sample: 'मंडळाच्या नमुना प्रश्नपत्रिका मोफत आहेत: <a href=''https://mahahsscboard.in'' target=''_blank'' rel=''noopener''>mahahsscboard.in</a> वर Student Login, नंतर Sample Question Paper उघडा आणि HSC किंवा SSC व विषय निवडा.'
    books: 'महाराष्ट्र बोर्डाची सर्व पाठ्यपुस्तके बालभारतीवर मोफत PDF मध्ये: <a href=''https://books.ebalbharati.in/'' target=''_blank'' rel=''noopener''>books.ebalbharati.in</a>'
    solutions: महाराष्ट्र बोर्ड पाठ्यपुस्तकांची प्रकरणनिहाय उत्तरे Shaalaa.com वर मोफत आहेत. इयत्तेनुसार लिंक <a href='{hd}'>हेल्प डेस्क</a>वर आहेत. आधी स्वतः सोडवा, मग तपासा.
    hallticket: हॉल तिकीट मंडळाकडून शाळेमार्फत परीक्षेच्या काही दिवस आधी मिळते. तारीख अजून जाहीर झालेली नाही; ती <a href='{hd}'>हेल्प डेस्क</a>वर दिली जाईल. मिळाल्यावर नाव, फोटो, बैठक क्रमांक, विषय आणि परीक्षा केंद्र तपासा आणि चूक असल्यास त्याच दिवशी शाळेला कळवा.
    study: '{phase}<br>संपूर्ण आठवडानिहाय नियोजनासाठी <a href=''{kit}'' target=''_blank'' rel=''noopener''>काउंटडाउन किट</a> पाहा.'
    kit: <b>बोर्ड परीक्षा काउंटडाउन किट 2027</b> हे आजपासून शेवटच्या पेपरपर्यंत पालकांसाठी 7 पानांचे नियोजन आहे, इंग्रजी, मराठी आणि उर्दूमध्ये. {price}<a href='{kit}' target='_blank' rel='noopener'>येथे घ्या</a>. पैशांची अडचण असल्यास बशीर सरांना मेसेज करा, ते मोफत पाठवतील.
    stress: परीक्षेची भीती बहुतेक वेळा काय उरले आहे हे माहीत नसल्यामुळे येते. काय झाले आणि काय उरले ते आठवड्यानुसार लिहून ठेवा. 7 ते 8 तास झोप, दर 45 मिनिटांनी छोटा ब्रेक, आणि गुणांबद्दल नव्हे तर प्रगतीबद्दल बोला. काळजीमुळे आठवडे झोप किंवा जेवण बिघडत असेल तर शाळेच्या समुपदेशकाशी किंवा डॉक्टरांशी बोला.
    result: बोर्डाचे निकाल साधारणपणे मे किंवा जूनमध्ये लागतात. नेमकी तारीख मंडळ अधिकृत वेबसाइटवर जाहीर करते, आणि ती <a href='{hd}'>हेल्प डेस्क</a>वरही दिली जाईल.
    career: पदवी झाली पण नोकरीचा शोध अडकलाय? <a href='{cc}'>करिअर क्लॅरिटी सत्र</a> हे बशीर सरांसोबत 60 मिनिटांचे सत्र आहे, आणि तुम्हाला 30 दिवसांचा लेखी आराखडा मिळतो. ₹1,499.
    stream: '10 वी नंतर शाखा निवडणे हा मोठा निर्णय आहे. तीन प्रश्नांनी सुरुवात करा: मुलाला कोणते विषय आवडतात, कोणत्या विषयांत गुण चांगले येतात, आणि कोणते करिअर आकर्षित करते? किटमध्ये शाखा निवडीसाठी वर्कशीट आहे, आणि तुम्ही WhatsApp वर बशीर सरांशी बोलू शकता.'
    contact: 'बशीर सर WhatsApp वर स्वतः उत्तर देतात:'
    fallback: 'याचे उत्तर अजून माझ्याकडे नाही. थेट बशीर सरांना WhatsApp वर विचारा:'
    price: 'बोर्ड परीक्षेपर्यंत विशेष किंमत ₹249. '
    phases:
    - 'आत्ता: <b>30 नोव्हेंबरपर्यंत अभ्यासक्रम पूर्ण करा</b>, मूल टाळत असलेली प्रकरणेही. प्रत्येक प्रकरणाला 1 ते 5 गुण द्या; 3 किंवा कमी असलेली प्रकरणे कमकुवत यादीत, रोज एक.'
    - 'आत्ता: <b>उजळणीची पहिली फेरी</b>. रोज एका विषयाचा भाग, मग पुस्तक बंद ठेवून 20 मिनिटे आठवून लिहा. रविवारी संध्याकाळी 10 मिनिटे एकत्र: काय झाले, पुढे काय.'
    - 'आत्ता: <b>सराव प्रश्नपत्रिका</b>. दर आठवड्याला घरी खऱ्या वेळेत एक पूर्ण पेपर, मग मंडळाच्या नमुना प्रश्नपत्रिकांशी तुलना करून तपासा.'
    - 'आत्ता: <b>प्रात्यक्षिके आणि उजळणीची दुसरी फेरी</b>. जर्नल पूर्ण आणि सही केलेले, मग सूत्रे, आकृत्या आणि व्याख्यांची रोज थोडी उजळणी.'
    - 'आत्ता: <b>परीक्षा मोड</b>. 7 ते 8 तास झोप, नवीन विषय नको, फक्त स्वतःच्या नोट्समधून उजळणी, आणि आदल्या दिवशी हॉल तिकीट व केंद्र तपासा.'
  hi:
    greet: नमस्ते! 👋 मैं महाराष्ट्र बोर्ड SSC और HSC परीक्षा 2027 के आम सवालों के जवाब देता हूँ। कोई विषय चुनें या अपना सवाल लिखें।
    dates: '<b>SSC (कक्षा 10वीं)</b> लिखित परीक्षा: 15 फ़रवरी से 11 मार्च 2027.<br><b>HSC (कक्षा 12वीं)</b> लिखित परीक्षा: 8 फ़रवरी से 16 मार्च 2027.<br>बोर्ड द्वारा 17 सितंबर 2026 को घोषित। <a href=''{cd}''>लाइव काउंटडाउन देखें</a>।'
    practical: '<b>HSC</b> प्रैक्टिकल, मौखिक और आंतरिक मूल्यांकन: 20 जनवरी से 6 फ़रवरी 2027.<br><b>SSC</b>: 28 जनवरी से 13 फ़रवरी 2027.<br>इसी हफ़्ते देख लें कि सारे जर्नल पूरे और साइन किए हुए हैं। प्रैक्टिकल की सही तारीख़ स्कूल बताएगा।'
    timetable: विषय-वार टाइमटेबल अभी जारी नहीं हुआ है। बोर्ड के जारी करते ही यह <a href='{hd}'>हेल्प डेस्क</a> पर आ जाएगा।
    sample: 'बोर्ड के अपने सैंपल प्रश्नपत्र मुफ़्त हैं: <a href=''https://mahahsscboard.in'' target=''_blank'' rel=''noopener''>mahahsscboard.in</a> पर Student Login, फिर Sample Question Paper खोलें और HSC या SSC व विषय चुनें।'
    books: 'महाराष्ट्र बोर्ड की सभी पाठ्यपुस्तकें बालभारती पर मुफ़्त PDF में: <a href=''https://books.ebalbharati.in/'' target=''_blank'' rel=''noopener''>books.ebalbharati.in</a>'
