# Tip of the day. Add new tips at the end. The homepage picks one per day
# (cycles through the list). Keep each tip to 2 or 3 short lines, awareness first.
- "Board exam ke time roz ek sawal poochiye: aaj kya samjha? Ek line mein jawab mil jaye toh revision sahi chal raha hai."
- "Exam form mein naam, maa ka naam aur subject list ek baar zaroor check karein. Yahi galtiyan hall ticket aur marksheet tak jaati hain."
- "Raat ko der tak padhne se better hai neend poori karna. Sone se pehle 10 minute ka revision yaad rakhne mein madad karta hai."
- "Padhai ka schedule bachche ke saath banayein. Jo plan bachcha khud banata hai, usse woh zyada follow karta hai."
- "Board ke sample papers pehle dekhein. Time ka andaza lagane ke liye purane papers par ek baar timer laga kar practice karein."
- "Hall ticket aate hi naam, center aur subjects check karein. Koi galti ho toh school ko abhi batayein, exam ke paas nahi."
- "Padhai ke beech 5 minute ka break lein. Lagatar baithne se thakan badhti hai aur focus ghatta hai."
- "Bachche se poochiye ki aaj kya seekha, sirf kitne marks aayenge yeh nahi. Seekhne ki baat se darr kam hota hai."
- "Padhai ke time phone doosre kamre mein rakhna sabse aasan tareeka hai. Notifications band hone se 20 minute ki focus mil sakti hai."
- "Exam se pehle roz ka ek chhota target rakhein, jaise 2 question ya ek chapter ka summary. Chhote target se confidence aata hai."
- "Results ke din bachche ke saath baith kar baat karein, sirf number par nahi. Ghar ka mahaul sabse badi madad hota hai."
- "Class 10 ya 12 ke baad ka raasta ek baar mein tay nahi hota. Bachche ki ruchi aur strengths ko dhyaan se dekhein."
- "Exam ke din subah naashta zaroor karayein. Khali pet paper mein dhyaan lagana mushkil hota hai."
- "Padhai ke liye ek shaant aur fixed jagah tay karein, bhale hi chhoti ho. Ek hi jagah padhne ki aadat focus badhati hai."
- "Teacher se baat karne mein jhijhkein nahi. Ek 10 minute ki baat kai hafton ki uljhan door kar sakti hai."
- "Galti par chillane ke bajaye samjhayein ki galti kahan hui. Sudhar tab hota hai jab bachcha darta nahi."
- "Sample paper ke answers apni notebook mein likhne ki aadat daalein. Exam mein likhne ki speed bhi isi se badhti hai."
- "Exam form, hall ticket aur results ke liye sirf official board website par bharosa karein. Kisi forward message ya naye link par nahi."
- "Koi bhi call ya message jo exam ke liye paise ya OTP maange, woh fraud ho sakta hai. Pehle school se confirm karein."
- "Bachche ko thoda time khelne aur dost se milne ka bhi dein. Ek balanced din exam ki tayyari ke liye behtar hota hai."
- "Ek saath poora syllabus dekhne se ghabrahat hoti hai. Ek kaagaz par baaki chapters likhein aur roz ek tod dein."
- "Galat jawab par charcha karna, sahi jawab rat lene se zyada kaam aata hai. Galti ko seekhne ka mauka samjhein."
- "Kisi subject mein atak jaye toh school ke notes ya free online videos se shuru karein. Poora syllabus ek saath mat dekhein."
- "Exam center tak ka route ek baar pehle dekh lein. Pehle se time ka andaza hone se subah ki bhaagdaud kam hoti hai."
- "Exam se ek raat pehle hall ticket, pen, pencil aur pehchaan patra ek jagah rakh lein. Subah ki ghabrahat kam hogi."
- "Bachche ki tareef uski mehnat par karein, nateeje par nahi. Mehnat ki aadat nateeje se zyada der tak tikti hai."
- "Har Monday ek chhota target likhein aur Sunday ko dekhein kya poora hua. Yeh tareeka poore saal chal sakta hai."
- "Padhai ke saath ek hobby bhi rakhein, jaise gaana ya drawing. Dimag ko aaram milta hai aur padhai mein mann wapas lagta hai."
